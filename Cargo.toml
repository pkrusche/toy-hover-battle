[package]
name = "toy-hover-battle"
version = "0.1.0"
edition = "2021"
description = "Small isometric battle game to explore AI-based engineering."
license = "CC-BY-NC-4.0"
repository = "https://github.com/pkrusche/toy-hover-battle"
homepage = "https://github.com/pkrusche/toy-hover-battle"
keywords = ["game", "macroquad", "hovercraft", "multiplayer"]
categories = ["games"]
publish = false

[lints.rust]
unexpected_cfgs = "allow"  # objc 0.2 uses legacy cfg(cargo-clippy)

[dependencies]
macroquad      = { version = "0.4", features = ["audio"] }
fastnoise-lite = "1"
rand           = "0.10"
rand_xoshiro   = "0.8"  # SmallRng replacement — rand 0.10 removed the small_rng feature

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
gilrs = "0.10"

# Keep deps fast even in debug — standard macroquad tip.
[profile.dev.package."*"]
opt-level = 3
